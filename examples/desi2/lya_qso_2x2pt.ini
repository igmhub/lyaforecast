[control]
measurement type = bao
per mag = False
plot bao = True
correlations = lya(qso)_lya(qso) lya(qso)_qso

[cosmo]
filename = Planck18.ini
z_ref = 2.3

[output]
overwrite = False
filename = /global/cfs/cdirs/desicollab/users/acuceu/notebooks_perl/forecasts/fisher/dev/desi-2-srd/data//output_lyaforecast/test

[survey]
band = r
max_band_mag = 26.75
min_band_mag = 16.1
num mag bins = 107
z bin min = 2.0
z bin max = 3.41
num z bins = 6
resolution = 2500
survey_area = 5000.0
reconstruction factor = 2.0
run version = v15

[tracer 1]
snr-file-dir = DESI-2-QSO
num exposures = 4
pix_width_ang = 0.8
dn dz = /global/cfs/cdirs/desicollab/users/acuceu/notebooks_perl/forecasts/fisher/dev/desi-2-srd/data//qso_target_selection/dn_dzdr_qso_desi_2.dat
tracer = lya
background_tracer = qso
tracer_type = continuous
target density = 90
min_rest_frame_lya = 1040
max_rest_frame_lya = 1205
min_band_mag = 16.1
max_band_mag = 26.75

[tracer 2]
dn dz = /global/cfs/cdirs/desicollab/users/acuceu/notebooks_perl/forecasts/fisher/dev/desi-2-srd/data//qso_target_selection/dn_dzdr_qso_desi_2.dat
tracer = qso
tracer_type = discrete
target density = 90
min_band_mag = 16.1
max_band_mag = 26.75

[power spectrum]
k_min_hmpc = 1e-2
k_max_hmpc = 0.5
num_k_bins = 500
mu_min = 0
mu_max = 1
num_mu_bins = 10
linear power = True

[biasing]

