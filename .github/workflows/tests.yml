name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev,plot,notebook]'
      - run: ruff check .
      - run: python -m pytest -m 'not examples'
      - if: matrix.python == '3.13'
        run: python -m pytest -m examples
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify distribution contents
        run: python scripts/check_distributions.py
      - name: Test installed wheel outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl pytest
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip check
          cp -r tests "$RUNNER_TEMP/tests"
          mkdir -p "$RUNNER_TEMP/examples"
          cp -r examples/desi2 "$RUNNER_TEMP/examples/desi2"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pytest tests -m 'not examples'
